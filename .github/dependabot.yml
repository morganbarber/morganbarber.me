version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    # Grouped so related packages move together — a Next.js bump that leaves
    # eslint-config-next behind is a broken build, not an update.
    groups:
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      supabase:
        patterns: ["@supabase/*"]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Majors of the framework are deliberate migrations, not routine bumps.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      # Types must describe the runtime (Node 22, see .nvmrc), not the newest
      # Node: @types/node 26 would type-check APIs that do not exist in prod.
      # Bump this together with .nvmrc and the engines field.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ESLint and @eslint/js release in lockstep; a major of one without the
      # other (and without the plugins supporting it) breaks every lint run.
      # ESLint majors are a deliberate migration.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # TypeScript majors wait for typescript-eslint and Next.js to support
      # them (TS 7 is the native rewrite; typescript-eslint 8 caps at <6.1).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
