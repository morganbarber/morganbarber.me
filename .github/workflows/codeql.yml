name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    # Code scanning on a PRIVATE repository requires GitHub Advanced Security;
    # without it the upload fails ("Code scanning is not enabled"). Runs as soon
    # as the repository is public (or GHAS is enabled — then drop this line).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # the analyze step reads the workflow run to tag results
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          # security-extended adds the injection, SSRF and XSS queries that the
          # default suite leaves out — the classes this codebase defends against.
          queries: security-extended
          config: |
            paths-ignore:
              - "**/node_modules"
              - "**/.next"
              - "**/*.test.ts"

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:javascript-typescript"
