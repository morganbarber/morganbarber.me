name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    # Code scanning on a PRIVATE repository requires GitHub Advanced Security;
    # without it the upload fails ("Code scanning is not enabled"). Runs as soon
    # as the repository is public (or GHAS is enabled — then drop this line).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # the analyze step reads the workflow run to tag results
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          # security-and-quality = security-extended (the injection, SSRF and
          # XSS queries the default suite leaves out) plus maintainability and
          # correctness checks, so quality issues are reported too.
          queries: security-and-quality
          config: |
            paths-ignore:
              - "**/node_modules"
              - "**/.next"
              - "**/*.test.ts"

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:javascript-typescript"
