name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# Read-only by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs, but let every commit on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build-time placeholders. The build must succeed without a live database —
  # the data layer is fail-soft by design — so CI never needs real credentials.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_ci_builds_only
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Format · Lint · Types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint (+ shellcheck on every run step)
        # Pinned by digest, like the actions: a tag can be re-pointed.
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"

      - name: Tests with coverage gate
        run: |
          mkdir -p coverage
          npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore

  boundaries:
    name: Package boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: The public site never imports a service-role module
        run: |
          # apps/portfolio has no legitimate reason to touch the admin client or
          # the admin data layer. If it ever does, the service-role key becomes
          # reachable from a deployed app — fail rather than ship it.
          if grep -rnE "@repo/(supabase|data)/admin" apps/portfolio --include='*.ts' --include='*.tsx'; then
            echo "::error::apps/portfolio imports a service-role module."
            exit 1
          fi

      - name: Shared packages never import from an app
        run: |
          # Dependencies flow apps -> packages, never the reverse. A package
          # importing app code creates a cycle Turborepo cannot schedule and
          # couples every consumer to one app's internals.
          if grep -rnE "from ['\"](@/|\.\./\.\./apps/)" packages tooling --include='*.ts' --include='*.tsx' --include='*.mjs'; then
            echo "::error::A shared package imports from an app."
            exit 1
          fi

      - name: Every workspace declares what it imports
        # npm hoisting hides undeclared @repo/* imports locally; an isolated
        # build (Vercel) or Turborepo's task graph does not. Pure Node, no install.
        run: node tooling/checks/bin/check-deps.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build all apps
        run: npm run build:all
        env:
          NEXT_PUBLIC_SITE_URL: https://morganbarber.me

  smoke:
    name: Headers & SEO (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, build]
    env:
      # Canonical URLs are built for this origin so the SEO audit can check them.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SEO_CANONICAL_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build
        run: npm run build

      - name: Start and audit
        run: |
          npm start --workspace portfolio-web > server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000 && break
            sleep 1
          done
          npm run check:headers
          npm run check:seo

      - name: Server log
        if: failure()
        run: cat server.log
