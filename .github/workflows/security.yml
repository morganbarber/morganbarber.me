name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: most advisories are published after a merge, not during one.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency audit & SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"

      - name: Known vulnerabilities (high and above)
        run: npm audit --audit-level=high

      - name: Registry signatures and provenance
        # `npm audit` is a CVE lookup; it says nothing about whether the
        # tarballs installed are the ones the registry published. This does.
        # NIST SSDF PS.2 / PW.4.1.
        run: npm audit signatures

      - name: Software bill of materials (CycloneDX)
        # NIST SSDF PS.3.2: a machine-readable inventory of what shipped.
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 90

  dependency-review:
    name: Dependency review
    # Needs the dependency graph, which on a private repository requires GitHub
    # Advanced Security. npm audit (above) covers advisories either way.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Block PRs that add vulnerable or non-permissive dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: on-failure

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # On pull_request, gitleaks-action lists the PR's commits via the API to
      # scope the scan; without this every PR fails "Resource not accessible".
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No .env file is tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env' | grep -v '\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Tracked .env files:"; echo "$tracked"; exit 1
          fi

      - name: No Supabase secret key in the source
        run: |
          if grep -rInE 'sb_secret_[A-Za-z0-9_-]{10,}' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude='*.md' .; then
            echo "::error::A Supabase secret key appears in the repository."; exit 1
          fi
