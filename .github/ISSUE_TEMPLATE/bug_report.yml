name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues must not be reported here.** See SECURITY.md or
        https://morganbarber.me/.well-known/security.txt.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Public site, Admin dashboard, Database / Supabase, CI / tooling, Deployment]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser + version, OS, or "production" / "local dev"
